<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK · Vessel Grid</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 20h4l5-10 5 10h4L12 2z" />
        </svg>
      </div>
      <div class="brand-name">
        <strong>ARK</strong>
        <span>Vessel Grid · Autonomous Recursive Kernel</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="live-badge" id="live-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="live-label">Live</span>
      </span>
      <button type="button" class="ghost-btn" id="refresh-btn">Refresh</button>
      <button type="button" class="ghost-btn icon-btn" id="theme-btn" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
      <span class="filter-updated" id="last-updated" role="status"></span>
    </div>
  </header>

  <main class="page">
    <!-- Status row: SOUL hash, generation, drift, west debt -->
    <section class="stat-row" id="status-row" aria-label="Vessel status"></section>

    <!-- Vessel grid: 4 node cards -->
    <section class="chart-grid" id="node-grid" aria-label="Vessel grid nodes"></section>

    <!-- Drift chart -->
    <article class="card card-wide" id="card-drift">
      <header class="card-head">
        <div>
          <h2>Drift from SOUL</h2>
          <p class="card-sub">Normalized SHA-256 distance per cycle · threshold 0.15</p>
        </div>
        <span class="drift-badge" id="drift-badge"></span>
      </header>
      <div class="chart-body" data-chart="drift"></div>
      <div class="drift-footer" id="drift-footer"></div>
    </article>

    <!-- Cycle history + stats -->
    <section class="bottom-grid">
      <article class="card" id="card-cycles">
        <header class="card-head">
          <div>
            <h2>Cycle History</h2>
            <p class="card-sub" id="cycle-stats"></p>
          </div>
          <button type="button" class="ghost-btn" id="run-cycle-btn">Run Cycle</button>
        </header>
        <ol class="cycle-list" id="cycle-list"></ol>
      </article>

      <article class="card" id="card-archive">
        <header class="card-head">
          <div>
            <h2>Archive Tiers</h2>
            <p class="card-sub">Thompson-sampled skill storage</p>
          </div>
        </header>
        <div class="tier-list" id="tier-list"></div>
      </article>
    </section>

    <!-- Runtime nodes detail -->
    <section class="chart-grid" id="node-detail-grid" aria-label="Node details"></section>
  </main>

  <div class="viz-tooltip" id="viz-tooltip" hidden></div>

  <script src="assets/ark-dashboard.js" defer></script>
</body>
</html>
